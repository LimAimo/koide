[package]
name = "diffusion-saf"
version = "0.1.0"
description = "Diffusion IDE Android Storage Access Framework plugin"
edition = "2021"
rust-version = "1.77.2"
links = "diffusion-saf"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
