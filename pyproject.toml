[project]
name = "diffusion-ide"
version = "0.9.0"
description = "Koide: a local-first AI IDE with an optional Python Bridge for Web/LAN compatibility."
requires-python = ">=3.10"
dependencies = []          # standard library only, so it installs anywhere including Termux

[project.scripts]
diffusion-bridge = "bridge.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bridge*"]
