name: Native Alpha7 Integration Check

on:
  workflow_dispatch:
  push:
    branches:
      - dev/native-complete-alpha7
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: diffusion-alpha7-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Android project
        run: pnpm --filter @diffusion/native exec tauri android init

      - name: Build Android ARM64 APK
        run: pnpm --filter @diffusion/native exec tauri android build --debug --apk --target aarch64

      - name: Verify Android APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/native/src-tauri/gen/android apps/native/src-tauri/target -type f -name '*.apk' | head -1)"
          if [ -z "${APK:-}" ]; then
            echo "::error::No APK was generated"
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/android
          find apps/native/src-tauri/gen/android -type f -name "*.apk" -exec cp -v {} artifacts/android/ \; || true
          find apps/native/src-tauri/target -type f -name "*.apk" -exec cp -v {} artifacts/android/ \; || true
          ls -lah artifacts/android || true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-android-arm64
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"

      - name: Install JavaScript dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows x64
        shell: pwsh
        run: pnpm --filter @diffusion/native exec tauri build --bundles nsis

      - name: Collect Windows binaries
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/windows" | Out-Null
          $target = "apps/native/src-tauri/target/release"
          if (Test-Path (Join-Path $target "diffusion-native.exe")) {
            Copy-Item (Join-Path $target "diffusion-native.exe") "artifacts/windows/Diffusion-IDE-portable.exe"
          }
          Get-ChildItem -Path (Join-Path $target "bundle/nsis") -Filter "*.exe" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "artifacts/windows"
          Get-ChildItem "artifacts/windows" -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-windows-x64
          path: artifacts/windows/*.exe
          if-no-files-found: error
          retention-days: 14

