name: Koide 1.0 Source Snapshot

on:
  push:
    branches:
      - dev/1.0.0

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v4
      - name: Remove repository metadata
        run: rm -rf .git
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Koide-1.0-dev-source
          path: .
          include-hidden-files: true
          retention-days: 7
