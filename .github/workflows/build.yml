name: Build Diffusion IDE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: write

env:
  CI: "true"

jobs:
  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Android project
        run: pnpm --filter @diffusion/native exec tauri android init

      - name: Build Android ARM64 APK
        run: pnpm --filter @diffusion/native exec tauri android build --apk --target aarch64

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/android
          find apps/native/src-tauri/gen/android -type f -name "*.apk" -exec cp -v {} artifacts/android/ \; || true
          find apps/native/src-tauri/target -type f -name "*.apk" -exec cp -v {} artifacts/android/ \; || true
          ls -lah artifacts/android || true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-android-arm64
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"

      - name: Install JavaScript dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows x64
        shell: pwsh
        run: pnpm --filter @diffusion/native exec tauri build --bundles nsis

      - name: Collect Windows binaries
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/windows" | Out-Null
          $target = "apps/native/src-tauri/target/release"
          if (Test-Path (Join-Path $target "diffusion-native.exe")) {
            Copy-Item (Join-Path $target "diffusion-native.exe") "artifacts/windows/Diffusion-IDE-portable.exe"
          }
          Get-ChildItem -Path (Join-Path $target "bundle/nsis") -Filter "*.exe" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "artifacts/windows"
          Get-ChildItem "artifacts/windows" -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-windows-x64
          path: artifacts/windows/*.exe
          if-no-files-found: error
          retention-days: 14


  release:
    name: Publish alpha Release
    needs:
      - android
      - windows
    runs-on: ubuntu-latest
    if: ${{ success() }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: diffusion-android-arm64
          path: release/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: diffusion-windows-x64
          path: release/windows

      - name: Prepare release assets
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("apps/native/src-tauri/tauri.conf.json"))["version"])')"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          mkdir -p release-assets

          APK="$(find release/android -type f -name '*.apk' | head -1)"
          if [ -z "${APK:-}" ]; then
            echo "::error::Android artifact did not contain an APK"
            exit 1
          fi
          cp "$APK" "release-assets/Diffusion-IDE-${VERSION}-android-arm64.apk"

          found_windows=0
          while IFS= read -r -d '' EXE; do
            found_windows=1
            NAME="$(basename "$EXE")"
            if [[ "${NAME,,}" == *portable* ]]; then
              OUT="Diffusion-IDE-${VERSION}-windows-x64-portable.exe"
            else
              OUT="Diffusion-IDE-${VERSION}-windows-x64-setup.exe"
            fi
            cp "$EXE" "release-assets/$OUT"
          done < <(find release/windows -type f -name '*.exe' -print0)

          if [ "$found_windows" -eq 0 ]; then
            echo "::error::Windows artifact did not contain an EXE"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -lah release-assets

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" release-assets/*             --repo "$GITHUB_REPOSITORY"             --title "Diffusion IDE ${VERSION} · Build #${GITHUB_RUN_NUMBER}"             --notes "Automated alpha build from commit ${GITHUB_SHA}. This is a prerelease; the project remains in alpha until the native migration and known bugs are finished."             --prerelease
