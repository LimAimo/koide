name: Koide Stable Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: koide-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  web-ui:
    name: Web UI + CodeMirror 6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build CodeMirror 6 editor
        run: pnpm build:cm6
      - name: Run Web and UI regression tests
        run: node --test tests/web/*.test.mjs

  bridge-compat:
    name: Bridge compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run optional Bridge regression tests
        run: python3 -m unittest discover -s tests/bridge -v

  native-core:
    name: Native Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify Runtime API / Native dispatch parity
        run: node scripts/check-native-parity.mjs
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"
      - name: Install Linux Tauri test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Run Native Core tests without Python Bridge
        working-directory: apps/native/src-tauri
        run: cargo test --lib --locked

  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"
      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Initialize Android project
        run: pnpm --filter @diffusion/native exec tauri android init
      - name: Generate Koide app icons
        run: pnpm --filter @diffusion/native exec tauri icon koide-icon.svg
      - name: Build Android ARM64 APK
        run: pnpm --filter @diffusion/native exec tauri android build --debug --apk --target aarch64
      - name: Verify Android APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/native/src-tauri/gen/android apps/native/src-tauri/target -type f -name '*.apk' | head -1)"
          if [ -z "${APK:-}" ]; then
            echo "::error::No APK was generated"
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("apps/native/src-tauri/tauri.conf.json"))["version"])')"
          mkdir -p artifacts/android
          APK="$(find apps/native/src-tauri/gen/android apps/native/src-tauri/target -type f -name '*.apk' | head -1)"
          cp "$APK" "artifacts/android/Koide-${VERSION}-android-arm64.apk"
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: koide-android-arm64
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"
      - name: Install JavaScript dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile
      - name: Generate Koide app icons
        shell: pwsh
        run: pnpm --filter @diffusion/native exec tauri icon koide-icon.svg
      - name: Build Windows x64
        shell: pwsh
        run: pnpm --filter @diffusion/native exec tauri build --bundles nsis
      - name: Collect Windows binaries
        shell: pwsh
        run: |
          $version = (Get-Content "apps/native/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path "artifacts/windows" | Out-Null
          $target = "apps/native/src-tauri/target/release"
          if (Test-Path (Join-Path $target "diffusion-native.exe")) {
            Copy-Item (Join-Path $target "diffusion-native.exe") "artifacts/windows/Koide-$version-windows-x64-portable.exe"
          }
          $installer = Get-ChildItem -Path (Join-Path $target "bundle/nsis") -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "artifacts/windows/Koide-$version-windows-x64-setup.exe"
          }
          Get-ChildItem "artifacts/windows"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: koide-windows-x64
          path: artifacts/windows/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish stable release
    needs:
      - web-ui
      - bridge-compat
      - native-core
      - android
      - windows
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: koide-android-arm64
          path: release-assets
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: koide-windows-x64
          path: release-assets
      - name: Publish Koide stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("apps/native/src-tauri/tauri.conf.json"))["version"])')"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "当前为候选版或开发版，仅保留构建产物，不创建正式 Release。"
            exit 0
          fi
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          awk -v version="$VERSION" '
            index($0, "## " version "（") == 1 { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Koide ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --latest
