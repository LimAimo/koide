name: Build Diffusion IDE

on:
  workflow_dispatch:
  push:
    paths:
      - "diffusion-ide-v*-native-source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Select source archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="$(find . -maxdepth 1 -type f -name 'diffusion-ide-v*-native-source.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "${SOURCE_ZIP:-}" ]; then
            echo "::error::No diffusion-ide-v*-native-source.zip exists in repository root."
            exit 1
          fi
          mkdir -p _source
          unzip -q "$SOURCE_ZIP" -d _source
          PROJECT_DIR="$(find _source -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building source from $SOURCE_ZIP"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.PROJECT_DIR }}/apps/native/src-tauri -> target"

      - name: Install JavaScript dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install --no-frozen-lockfile

      - name: Build Android ARM64 APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm --filter @diffusion/native exec tauri android build --apk --target aarch64

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/android
          find "$PROJECT_DIR/apps/native/src-tauri/gen/android" -type f -name "*.apk" -exec cp -v {} artifacts/android/ \; || true
          find "$PROJECT_DIR/apps/native/src-tauri/target" -type f -name "*.apk" -exec cp -v {} artifacts/android/ \; || true
          ls -lah artifacts/android || true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-android-arm64
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Select source archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "diffusion-ide-v*-native-source.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $zip) {
            Write-Error "No diffusion-ide-v*-native-source.zip exists in repository root."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "_source" | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath "_source" -Force
          $project = Get-ChildItem -Path "_source" -Directory | Select-Object -First 1
          "PROJECT_DIR=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building source from $($zip.Name)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.PROJECT_DIR }}/apps/native/src-tauri -> target"

      - name: Install JavaScript dependencies
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows x64
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm --filter @diffusion/native exec tauri build --bundles nsis

      - name: Collect Windows binaries
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/windows" | Out-Null
          $target = Join-Path $env:PROJECT_DIR "apps/native/src-tauri/target/release"
          if (Test-Path (Join-Path $target "diffusion-native.exe")) {
            Copy-Item (Join-Path $target "diffusion-native.exe") "artifacts/windows/Diffusion-IDE-portable.exe"
          }
          Get-ChildItem -Path (Join-Path $target "bundle/nsis") -Filter "*.exe" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "artifacts/windows"
          Get-ChildItem "artifacts/windows" -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-windows-x64
          path: artifacts/windows/*.exe
          if-no-files-found: error
          retention-days: 14
